# Mirrors the `docs/` folder of every tag of the private code repo min-agent/Min
# into this docs repo, regenerates the markdown source of docs/index so it links
# every folder in docs/, converts pages to HTML, encrypts every page with
# StatiCrypt, commits the result, and publishes docs/ to GitHub Pages.
# StatiCrypt can only encrypt HTML, so the markdown index is published as
# docs/index.html rather than docs/index.md.
#
# Every run is a full rebuild: all tags are cloned again from scratch and every
# page is re-encrypted. The workflow takes no parameters.
#
# Required repository configuration
#   Secrets
#     DOCS_BOT_TOKEN        Fine-grained PAT or GitHub App token that can read
#                           the code repo ("Contents: read").
#     STATICRYPT_PASSWORD   Set manually in this repo's Actions secrets. It must
#                           be at least 14 characters long.
#   Variables
#     STATICRYPT_SALT       Optional 32 character hex salt. When unset, a random
#                           salt is generated once and kept in
#                           .github/docs-sync-state.json.
#
# Triggers
#   push and merged pull requests in this repo, repository_dispatch
#   (type: code-repo-release) sent by min-agent/Min on a release, and manual
#   runs from the Actions tab. Payloads are ignored.
#
# Password handling
#   This workflow only reads STATICRYPT_PASSWORD. If the secret is missing or
#   too short, it fails with an instruction to set it manually.

name: Sync, encrypt, and publish docs

on:
  push:
    branches: ["main"]
  pull_request_target:
    types: [closed]
  repository_dispatch:
    types: [code-repo-release]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    name: Sync, encrypt, and publish
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CODE_REPO: min-agent/Min
      SYNC_TOKEN: ${{ secrets.DOCS_BOT_TOKEN }}
      STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
      STATICRYPT_SALT: ${{ vars.STATICRYPT_SALT }}
      PANDOC_VERSION: "3.14"
      PANDOC_SHA256: "c5f4720cdefb3f7bdc5d07202ef579feef0d1370773c873804dd8fdaa8c4f1b8"
      STATICRYPT_VERSION: "3.5.4"

    steps:
      - name: Check required configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "::error::Secret DOCS_BOT_TOKEN is not set."
            missing=1
          fi

          if [ -z "${STATICRYPT_PASSWORD:-}" ]; then
            echo "::error::STATICRYPT_PASSWORD is not set. Add it under Settings > Secrets and variables > Actions in this repository, with a value of at least 14 characters."
            missing=1
          elif [ "${#STATICRYPT_PASSWORD}" -lt 14 ]; then
            echo "::error::STATICRYPT_PASSWORD is shorter than 14 characters. Update the repository secret and run this workflow again."
            missing=1
          fi

          exit "$missing"

      - name: Check out the docs repo
        uses: actions/checkout@v4
        with:
          # Kept so the staging step can read the private code repo through
          # git's persisted extraheader. The push below overrides this token.
          token: ${{ secrets.DOCS_BOT_TOKEN }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache pinned tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ runner.temp }}/pandoc-tools
          key: docs-tools-staticrypt-${{ env.STATICRYPT_VERSION }}-pandoc-${{ env.PANDOC_VERSION }}
          restore-keys: docs-tools-staticrypt-${{ env.STATICRYPT_VERSION }}-pandoc-

      - name: Install pinned pandoc
        env:
          PANDOC_DIR: ${{ runner.temp }}/pandoc-tools
        run: |
          set -euo pipefail
          mkdir -p "$PANDOC_DIR"

          if [ ! -x "$PANDOC_DIR/pandoc" ]; then
            curl --fail --silent --show-error --location \
              --output "$PANDOC_DIR/pandoc.tar.gz" \
              "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"

            echo "${PANDOC_SHA256}  ${PANDOC_DIR}/pandoc.tar.gz" | sha256sum --check -

            tar -xzf "$PANDOC_DIR/pandoc.tar.gz" -C "$PANDOC_DIR" \
              --strip-components=2 "pandoc-${PANDOC_VERSION}/bin/pandoc"

            rm -f "$PANDOC_DIR/pandoc.tar.gz"
          fi

          "$PANDOC_DIR/pandoc" --version | head -n 1
          echo "$PANDOC_DIR" >> "$GITHUB_PATH"

      - name: Stage documentation from every tag
        id: stage
        env:
          STAGE_DIR: ${{ runner.temp }}/staticrypt-stage
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import secrets
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          def note(message):
              print(f"::notice::{message}")

          slug = os.environ["CODE_REPO"].strip().strip("/")
          if slug.endswith(".git"):
              slug = slug[:-4]

          token = os.environ["SYNC_TOKEN"]
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          docs_dir = workspace / "docs"
          state_path = workspace / ".github" / "docs-sync-state.json"
          stage = Path(os.environ["STAGE_DIR"]).resolve()

          # Configure a one-process Git credential helper using a temporary
          # executable. The secret is never placed in argv, the remote URL,
          # an extra header, or process-list-visible command arguments.
          username = "x-access-token"
          askpass = Path(tempfile.mkdtemp()) / "git-askpass.py"

          askpass.write_text(
              "#!/usr/bin/python3\n"
              "import os\n"
              "import sys\n"
              "prompt = sys.argv[1].lower()\n"
              "if 'username' in prompt:\n"
              "    print(os.environ['GIT_AUTH_USERNAME'])\n"
              "else:\n"
              "    print(os.environ['GIT_AUTH_PASSWORD'])\n",
              encoding="utf-8",
          )
          askpass.chmod(0o700)

          os.environ["GIT_AUTH_USERNAME"] = username
          os.environ["GIT_AUTH_PASSWORD"] = token
          os.environ["GIT_ASKPASS"] = str(askpass)
          os.environ["GIT_TERMINAL_PROMPT"] = "0"
          os.environ["GCM_INTERACTIVE"] = "never"

          def run(args):
              try:
                  return subprocess.run(
                      args,
                      check=True,
                      capture_output=True,
                      text=True,
                  ).stdout
              except subprocess.CalledProcessError as error:
                  diagnostic = (error.stderr or "").strip()
                  if token:
                      diagnostic = diagnostic.replace(token, "[REDACTED]")
                  print(
                      f"::error::Git command failed: {diagnostic}",
                      file=sys.stderr,
                  )
                  raise

          shutil.rmtree(stage, ignore_errors=True)
          stage.mkdir(parents=True)
          docs_dir.mkdir(parents=True, exist_ok=True)
          (docs_dir / ".nojekyll").touch()

          state = {"salt": None}
          if state_path.exists():
              state.update(json.loads(state_path.read_text(encoding="utf-8")))

          remote = f"https://github.com/{slug}.git"

          tags = {}
          for line in run(["git", "ls-remote", "--tags", remote]).splitlines():
              if not line.strip():
                  continue

              sha, ref = line.split("\t")
              name = ref[len("refs/tags/"):]

              if name.endswith("^{}"):
                  tags[name[:-3]] = sha
              else:
                  tags.setdefault(name, sha)

          if not tags:
              note("The code repo has no tags.")

          def folder_for(tag):
              return re.sub(r"[^A-Za-z0-9._-]+", "-", tag).strip("-.")

          imported = []
          without_docs = []
          used_folders = set()

          for tag in sorted(tags):
              folder = folder_for(tag)

              if not folder or folder in {".", ".."}:
                  print(
                      f"::error::Tag '{tag}' cannot be turned into a directory name.",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              base = folder
              suffix = 0
              while folder in used_folders:
                  suffix += 1
                  folder = f"{base}-{suffix}"

              used_folders.add(folder)

              destination = stage / folder
              checkout = Path(tempfile.mkdtemp())

              try:
                  run([
                      "git",
                      "clone",
                      "--quiet",
                      "--depth",
                      "1",
                      "--filter=blob:none",
                      "--sparse",
                      "--branch",
                      tag,
                      remote,
                      str(checkout),
                  ])

                  if "docs" not in run([
                      "git",
                      "-C",
                      str(checkout),
                      "ls-tree",
                      "--name-only",
                      "HEAD",
                  ]).split():
                      without_docs.append(tag)
                      continue

                  run([
                      "git",
                      "-C",
                      str(checkout),
                      "sparse-checkout",
                      "set",
                      "docs",
                  ])

                  source = checkout / "docs"

                  if (
                      not source.is_dir()
                      or not any(p.is_file() for p in source.rglob("*"))
                  ):
                      without_docs.append(tag)
                      continue

                  shutil.copytree(
                      source,
                      destination,
                      ignore=shutil.ignore_patterns(".git"),
                  )
              finally:
                  shutil.rmtree(checkout, ignore_errors=True)

              shutil.rmtree(docs_dir / folder, ignore_errors=True)

              index_names = {
                  "index.md",
                  "index.markdown",
                  "index.html",
                  "index.htm",
              }

              if not any(
                  p.is_file()
                  and p.name.lower() in index_names
                  for p in destination.iterdir()
              ):
                  entries = sorted(
                      p.name
                      for p in destination.iterdir()
                      if p.is_file() and not p.name.startswith(".")
                  )
                  lines = [f"# {tag}", ""]
                  lines += [
                      f"- [{entry}](./{entry})"
                      for entry in entries
                  ]
                  (destination / "index.md").write_text(
                      "\n".join(lines) + "\n",
                      encoding="utf-8",
                  )

              imported.append(tag)

          folders = sorted(
              {
                  p.name
                  for p in docs_dir.iterdir()
                  if p.is_dir() and not p.name.startswith(".")
              }
              | {
                  p.name
                  for p in stage.iterdir()
                  if p.is_dir()
              },
          )

          def version_key(name):
              return tuple(
                  (
                      0,
                      int(part),
                      "",
                  )
                  if part.isdigit()
                  else (
                      1,
                      0,
                      part.lower(),
                  )
                  for part in re.split(r"(\d+)", name)
              )

          index_lines = [
              "# Documentation",
              "",
              "Encrypted documentation for each tagged release.",
              "",
          ]
          index_lines += [
              f"- [{folder}](./{folder}/)"
              for folder in sorted(
                  folders,
                  key=version_key,
                  reverse=True,
              )
          ]

          (stage / "index.md").write_text(
              "\n".join(index_lines) + "\n",
              encoding="utf-8",
          )

          salt = (
              os.environ.get("STATICRYPT_SALT") or ""
          ).strip() or state.get("salt") or secrets.token_hex(16)

          state_path.parent.mkdir(parents=True, exist_ok=True)
          state_path.write_text(
              json.dumps(
                  {"salt": salt},
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )

          if imported:
              note("Imported: " + ", ".join(imported))

          if without_docs:
              note("No docs/ folder at: " + ", ".join(without_docs))

          note("Index regenerated.")

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8",
          ) as env_file:
              env_file.write(
                  f"STATICRYPT_SALT_RESOLVED={salt}\n"
              )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output_file:
              needed = "true" if any(stage.iterdir()) else "false"
              output_file.write(f"needed={needed}\n")
          PY

      - name: Convert markdown to HTML
        if: steps.stage.outputs.needed == 'true'
        shell: bash
        env:
          STAGE_DIR: ${{ runner.temp }}/staticrypt-stage
        run: |
          set -euo pipefail
          cd "$STAGE_DIR"

          while IFS= read -r -d '' source; do
            target="${source%.*}.html"

            if [ -e "$target" ]; then
              echo "::error::Both ${source#./} and ${target#./} exist; refusing to overwrite an authored page."
              exit 1
            fi

            relative="${source#./}"
            title="${relative%.*}"

            pandoc \
              --from gfm \
              --to html5 \
              --standalone \
              --metadata "title=$title" \
              --output "$target" \
              "$source"

            rm -f "$source"
          done < <(
            find . -type f \
              \( -iname '*.md' -o -iname '*.markdown' \) \
              -print0
          )

          find . -type f \
            \( -iname '*.html' -o -iname '*.htm' \) \
            -print0 |
            xargs -0 --no-run-if-empty sed -i -E \
              's/href="([^"#]+)\.(md|markdown)(#[^"]*)?"/href="\1.html\3"/Ig'

      - name: Inject custom CSS and navigation into every page
        if: steps.stage.outputs.needed == 'true'
        shell: bash
        env:
          STAGE_DIR: ${{ runner.temp }}/staticrypt-stage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import os
          import re
          from pathlib import Path
          from urllib.parse import quote

          stage = Path(os.environ["STAGE_DIR"]).resolve()
          css_path = Path(os.environ["GITHUB_WORKSPACE"]) / "docs-custom.css"

          if not css_path.is_file():
              raise SystemExit(f"::error::Custom CSS file not found: {css_path}")

          css = css_path.read_text(encoding="utf-8").strip()
          if not css:
              print("::notice::Custom CSS file is empty; nothing to inject.")
              raise SystemExit(0)

          # Inlined so the rules are part of the HTML that StatiCrypt encrypts,
          # rather than a separate clear-text file or the password template.
          style_block = f"<style>\n{css}\n</style>\n"

          pages = sorted(
              p for p in stage.rglob("*")
              if p.is_file() and p.suffix.lower() in {".html", ".htm"}
          )

          def version_key(name):
              return tuple(
                  (0, int(part), "") if part.isdigit() else (1, 0, part.lower())
                  for part in re.split(r"(\d+)", name)
              )

          def make_label(page):
              stem = page.stem
              if stem.lower() == "index":
                  return "Overview"
              return " ".join(
                  word[:1].upper() + word[1:]
                  for word in re.split(r"[-_]+", stem)
                  if word
              )

          def page_href(target, current):
              relative = os.path.relpath(target, start=current.parent)
              return quote(relative.replace(os.sep, "/"), safe="/")

          def link_item(page, current):
              is_current = page == current
              classes = "nav-link is-current" if is_current else "nav-link"
              current_attr = ' aria-current="page"' if is_current else ""
              return (
                  f'<li><a class="{classes}" href="{page_href(page, current)}"'
                  f'{current_attr}>{html.escape(make_label(page))}</a></li>'
              )

          # Build a tree of directories and the pages they contain.
          tree = {"dirs": {}, "files": []}
          for page in pages:
              rel = page.relative_to(stage).parts
              node = tree
              for part in rel[:-1]:
                  node = node["dirs"].setdefault(part, {"dirs": {}, "files": []})
              node["files"].append(page)

          def render(node, path_parts, current, current_parts, top=False):
              files = sorted(
                  (p for p in node["files"] if not (top and p.stem.lower() == "index")),
                  key=lambda p: version_key(p.name),
              )
              dirs = sorted(node["dirs"].items(), key=lambda kv: version_key(kv[0]))

              items = [(version_key(p.name), link_item(p, current)) for p in files]
              for name, child in dirs:
                  child_parts = path_parts + (name,)
                  # Only sections on the path to the current page start expanded.
                  open_attr = (
                      " open" if child_parts == current_parts[: len(child_parts)] else ""
                  )
                  items.append((
                      version_key(name),
                      '<li><details class="nav-section"' + open_attr + ">\n"
                      f"<summary>{html.escape(name)}</summary>\n"
                      f'<ul class="nav-list">\n'
                      f'{render(child, child_parts, current, current_parts)}\n'
                      "</ul>\n"
                      "</details></li>",
                  ))

              # Versions are listed newest first; everything else is alphabetical.
              items.sort(key=lambda item: item[0], reverse=top)
              return "\n".join(fragment for _, fragment in items)

          def build_nav(current):
              current_parts = current.relative_to(stage).parts
              home = os.path.relpath(stage / "index.html", start=current.parent)
              home_href = quote(home.replace(os.sep, "/"), safe="/")
              return (
                  '<nav class="docs-nav" aria-label="Documentation navigation">\n'
                  '<div class="docs-nav-heading">'
                  f'<a href="{home_href}">Documentation</a>'
                  "</div>\n"
                  f'<ul class="nav-list">\n'
                  f'{render(tree, (), current, current_parts, top=True)}\n'
                  "</ul>\n"
                  "</nav>\n"
              )

          injected = 0
          for page in pages:
              page_html = page.read_text(encoding="utf-8")
              lowered = page_html.lower()
              head_close = lowered.find("</head>")

              if head_close != -1:
                  page_html = page_html[:head_close] + style_block + page_html[head_close:]
              elif lowered.find("<html") != -1:
                  html_tag_end = lowered.find(">", lowered.find("<html")) + 1
                  page_html = page_html[:html_tag_end] + "\n" + style_block + page_html[html_tag_end:]
              else:
                  page_html = style_block + page_html

              # The sidebar has to live in <body>, so find that tag in the
              # (already modified) document and insert the tree right after it.
              body_match = re.search(r"<body\b[^>]*>", page_html, flags=re.IGNORECASE)
              if body_match:
                  insert_at = body_match.end()
                  page_html = page_html[:insert_at] + "\n" + build_nav(page) + page_html[insert_at:]
              else:
                  page_html += "\n" + build_nav(page)

              page.write_text(page_html, encoding="utf-8")
              injected += 1

          print(f"::notice::Injected custom CSS and navigation into {injected} page(s).")
          PY

      - name: Encrypt every page with StatiCrypt
        if: steps.stage.outputs.needed == 'true'
        shell: bash
        env:
          STAGE_DIR: ${{ runner.temp }}/staticrypt-stage
        run: |
          set -euo pipefail
          cd "$STAGE_DIR"

          npx --yes "staticrypt@${STATICRYPT_VERSION}" ./* \
            --recursive \
            --directory "$GITHUB_WORKSPACE/docs" \
            --salt "$STATICRYPT_SALT_RESOLVED" \
            --config false \
            --short \
            --template-title "Protected documentation"

      - name: Verify that no page is left in clear text
        if: steps.stage.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          plaintext="$(
            find "$GITHUB_WORKSPACE/docs" -type f \
              \( -iname '*.md' -o -iname '*.markdown' \) \
              -print -quit
          )"

          if [ -n "$plaintext" ]; then
            echo "::error::Plaintext markdown found under docs/: $plaintext"
            exit 1
          fi

          html_pages="$(
            find "$GITHUB_WORKSPACE/docs" -type f \
              \( -iname '*.html' -o -iname '*.htm' \) \
              -print -quit
          )"

          if [ -z "$html_pages" ]; then
            echo "::error::No HTML pages were produced under docs/."
            exit 1
          fi

          unencrypted="$(
            grep --recursive --files-without-match \
              'staticryptEncryptedMsgUniqueVariableName' \
              "$GITHUB_WORKSPACE/docs" \
              --include='*.html' --include='*.htm' \
              --include='*.HTML' --include='*.HTM' ||
            true
          )"

          if [ -n "$unencrypted" ]; then
            echo "::error::These pages were not encrypted:"
            printf '%s\n' "$unencrypted"
            exit 1
          fi

      - name: Commit and push
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "docs-sync-bot"
          git config user.email "docs-sync-bot@users.noreply.github.com"

          git add --all docs .github/docs-sync-state.json

          if git diff --cached --quiet; then
            echo "::notice::Nothing to commit."
            exit 0
          fi

          git commit \
            --message "docs: sync and encrypt documentation for tagged releases [skip ci]"

          # DOCS_BOT_TOKEN cannot write to this repo, so authenticate the push
          # with the workflow token, which has `contents: write` from the
          # workflow permissions block above.
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 --wrap=0)"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git -c "http.https://github.com/.extraheader=$auth_header" \
            push \
            origin \
            "HEAD:${{ github.event.repository.default_branch }}"

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the docs directory so it becomes the site root
          path: './docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
