# Sets or rotates the password used by sync-encrypted-docs.yml.
#
# GitHub Actions has no way to prompt a developer during a running job. The
# required `password` input on the manual run form is that prompt: enter the new
# password there, and this workflow writes it to the STATICRYPT_PASSWORD
# repository secret and dispatches a full re-encryption. Run it once to
# initialise the secret, and again whenever the password must change.
#
# Security note: workflow_dispatch inputs are retained in GitHub's run metadata
# and are visible to anyone who can read Actions runs. The value is masked in
# logs, but the run form still shows it. Configure required reviewers on the
# `staticrypt-password` environment and rotate the password if that exposure is
# unacceptable for your threat model.
#
# Requires secret DOCS_BOT_TOKEN with "Secrets: read and write",
# "Actions: read and write" and "Contents: read" on this docs repo.

name: Set StatiCrypt password

on:
  workflow_dispatch:
    inputs:
      password:
        description: "New password, at least 14 characters. Saved as the STATICRYPT_PASSWORD secret; all pages are re-encrypted with it."
        required: true
        type: string

concurrency:
  group: set-staticrypt-password
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  rotate:
    name: Store password and re-encrypt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staticrypt-password
    env:
      NEW_PASSWORD: ${{ inputs.password }}
      GH_TOKEN: ${{ secrets.DOCS_BOT_TOKEN }}
    steps:
      - name: Mask and validate the password
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$NEW_PASSWORD"
          if [ "${#NEW_PASSWORD}" -lt 14 ]; then
            echo "::error::StatiCrypt encrypts pages that anyone can download, so the password must be at least 14 characters long."
            exit 1
          fi

      - name: Write STATICRYPT_PASSWORD
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$NEW_PASSWORD"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret DOCS_BOT_TOKEN is not set; GITHUB_TOKEN cannot write repository secrets."
            exit 1
          fi
          printf '%s' "$NEW_PASSWORD" | gh secret set STATICRYPT_PASSWORD --repo "$GITHUB_REPOSITORY"
          echo "::notice::STATICRYPT_PASSWORD updated."

      # A secret written during a run is not visible to later jobs of the same
      # run, so the re-encryption must be a separate workflow run. Wait for it
      # and fail this job if it fails, so a rotation is never reported as
      # successful while the published pages still use the old password.
      - name: Dispatch full re-encryption
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT_BRANCH="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run sync-encrypted-docs.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f rebuild_all=true
          echo "SYNC_STARTED_AT=$STARTED_AT" >> "$GITHUB_ENV"

      - name: Wait for re-encryption to succeed
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=""
          for attempt in $(seq 1 12); do
            RUN_ID="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow sync-encrypted-docs.yml \
              --event workflow_dispatch \
              --created ">=${SYNC_STARTED_AT}" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::Could not find the re-encryption run dispatched by this workflow."
            exit 1
          fi
          echo "::notice::Waiting for re-encryption run ${RUN_ID}."

          for attempt in $(seq 1 90); do
            STATE="$(gh run view "$RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --json status,conclusion \
              --jq '.status + " " + (.conclusion // "")')"
            case "$STATE" in
              "completed success")
                echo "::notice::Re-encryption run ${RUN_ID} succeeded."
                exit 0
                ;;
              completed*)
                echo "::error::Re-encryption run ${RUN_ID} finished as ${STATE}. The password secret has changed but the published pages may not have been updated."
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for re-encryption run ${RUN_ID}."
          exit 1
